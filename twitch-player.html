<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="origin" />
    <title>Twitch broadcast player</title>
    <style>
      html, body, #player, #player iframe { width: 100%; height: 100%; margin: 0; border: 0; background: #000; }
      body { overflow: hidden; color: #fff; font: 16px Arial, sans-serif; }
      #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; background: #100c18; }
      #status[hidden] { display: none; }
      button { padding: 12px 20px; color: white; background: #6432ad; border: 1px solid #ba96ff; cursor: pointer; }
    </style>
    <script src="twitch-player.js" defer></script>
  </head>
  <body>
    <div id="player"></div>
    <div id="status" role="status"><p id="message">Loading Twitch…</p><button id="retry" hidden>Retry player</button></div>
  </body>
</html>
